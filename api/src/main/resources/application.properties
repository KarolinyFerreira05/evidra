spring.config.import=optional:file:./local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/evidra?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
server.port=${PORT:3000}
# InnoDB rejects a single BLOB write above 10% of innodb_redo_log_capacity (default 100MB),
# so 20MB would fail on insert. Keep this in sync with the 10 MB text in index.html and App.js.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Existing databases were created by hand: mark them as version 1 so V2+ run on top.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
app.jwt-secret=${JWT_SECRET:}
app.default-password=${DEFAULT_PASSWORD:}